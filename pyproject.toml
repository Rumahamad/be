[project]
name = "bnc-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "cryptography>=42",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic-settings>=2.6",
  "PyJWT[crypto]>=2.10",
  "reportlab>=4.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]
